<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" role="img" aria-label="Nexo">
  <!--
    O símbolo do Nexo: o orbe do agente, ESTÁTICO — esfera de vidro escura com o
    nó aceso dentro.

    Esta é a AFINAÇÃO DE TAMANHO PEQUENO, e é de propósito: aqui a marca vive
    como favicon, de 16 a 32px. Uma esfera escura sobre fundo escuro perde a
    silhueta nesse tamanho — o favicon simplesmente some. Então o corpo clareia
    e o nó engrossa: quem carrega a leitura é o nó e o anel, não o volume do
    vidro, que ali ninguém enxerga de todo jeito.

    Cor fixa (não `currentColor`): favicon não resolve variável de CSS.

    A versão grande vive em `components/brand/logo-nexo.tsx`, que ajusta estes
    mesmos valores conforme o tamanho pedido. Mudou aqui, mude lá.
  -->
  <defs>
    <radialGradient id="corpo" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#2a7a72"/>
      <stop offset="55%" stop-color="#12343a"/>
      <stop offset="100%" stop-color="#0b2126"/>
    </radialGradient>
    <linearGradient id="aresta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7af7e1"/>
      <stop offset="42%" stop-color="#00a693" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#00a693" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="no" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7af7e1"/>
      <stop offset="100%" stop-color="#00a693"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="11" fill="url(#corpo)"/>
  <circle cx="12" cy="12" r="11" fill="none" stroke="url(#aresta)" stroke-width="1.6"/>
  <path fill="none" stroke="url(#no)" stroke-width="2.9" stroke-linecap="round"
        d="M12 12c-1.85-2.5-3.5-3.75-4.85-3.75-1.65 0-2.7 1.55-2.7 3.75s1.05 3.75 2.7 3.75c1.35 0 3-1.25 4.85-3.75Zm0 0c1.85-2.5 3.5-3.75 4.85-3.75 1.65 0 2.7 1.55 2.7 3.75s-1.05 3.75-2.7 3.75c-1.35 0-3-1.25-4.85-3.75Z"/>
</svg>
