<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5bdac6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Nexo">
  <!--
    O símbolo do Nexo: o orbe do agente, ACHATADO.

    Sem brilho e sem gradiente de propósito — é a redução que precisa funcionar
    em 16px, em preto e branco e sobre fundo claro. O halo do orbe vivo vira
    mancha nesse tamanho, e o que sobraria seria um ponto verde.

    Cor fixa (não `currentColor`): favicon não resolve variável de CSS.
    Traço 1,75 — o degrau do meio da escala (1,5 grande · 1,75 médio · 2 em 16px),
    para o nó não fechar quando encolhe.
  -->
  <circle cx="12" cy="12" r="10.25"/>
  <path d="M12 12c-1.9-2.6-3.6-3.9-5-3.9-1.7 0-2.8 1.6-2.8 3.9s1.1 3.9 2.8 3.9c1.4 0 3.1-1.3 5-3.9Zm0 0c1.9-2.6 3.6-3.9 5-3.9 1.7 0 2.8 1.6 2.8 3.9s-1.1 3.9-2.8 3.9c-1.4 0-3.1-1.3-5-3.9Z"/>
</svg>
