# O Nexo na Render — UM serviço, com Node e LibreOffice no mesmo container.
#
# O arranjo anterior era Vercel (app) + Render (só a conversão de PDF). Foi
# trocado por dois motivos concretos, não por gosto:
#
# 1. nenhuma rota declara `maxDuration`, e a auditoria profunda roda 24 blocos
#    com 5 em paralelo — função serverless morre no meio;
# 2. as rotas leem os modelos ODT do disco por `process.cwd()`, e um empacotador
#    que não rastreia esses arquivos gera um deploy que falha SÓ em produção.
#
# O serviço `nexodoc-converter` continua declarado no fim, comentado: quem
# preferir o arranjo separado o reativa sem reescrever nada.

services:
  - type: web
    name: nexodoc
    runtime: docker
    region: oregon
    plan: starter # o free hiberna, e a primeira visita do dia paga o cold start
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      # ---------------------------------------------------------------- banco
      # A URL do Neon. `fromDatabase` não serve: o banco é externo à Render.
      - key: DATABASE_URL
        sync: false

      # ----------------------------------------------------------------- auth
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      # A URL PÚBLICA do serviço, e ela NÃO é opcional.
      #
      # `AUTH_TRUST_HOST` sozinho não resolve atrás do proxy da Render: ele lê o
      # `x-forwarded-proto` (por isso o esquema sai certo), mas a Render não
      # repassa o host original, e sobra o `Host` interno. O Auth.js conclui que
      # mora em `https://localhost:10000` e manda ISSO ao Google como
      # `redirect_uri` — que recusa com `redirect_uri_mismatch`, num erro que não
      # explica nada. Aconteceu no primeiro deploy.
      #
      # Sem barra no fim. Ao trocar por domínio próprio, troque aqui também.
      - key: AUTH_URL
        sync: false
      - key: NEXODOC_ADMIN_EMAILS
        sync: false
      # O TOKEN DO PAINEL ADMIN — e ele não é opcional.
      #
      # Faltava aqui, e a consequência é silenciosa do pior jeito: as SETE telas
      # do `/admin` respondem "NEXODOC_ADMIN_TOKEN não configurado" e ninguém
      # entra. Não é erro de acesso negado, é a variável ausente — e a mensagem
      # só aparece depois de digitar um token que jamais seria aceito.
      #
      # Descoberto em 13/08/2026, tentando confirmar em produção o trabalho de
      # admin que tinha acabado de subir: o painel estava inacessível desde
      # sempre, e o `render.yaml` não registrava que a variável existia.
      #
      # `sync: false`: o valor vive no painel da Render (é segredo), e esta
      # linha existe para que a próxima pessoa saiba que ele precisa estar lá.
      - key: NEXODOC_ADMIN_TOKEN
        sync: false

      # ------------------------------------------------------------------- IA
      #
      # ESTAS VARIÁVEIS NÃO SÃO OPCIONAIS, e o motivo é chato: os padrões
      # escritos no código NÃO são os valores que foram afinados em uso. Quem
      # ajustou modelo no `.env.local` e não repetiu aqui volta ao padrão do
      # código sem nenhum aviso — o software funciona, só que mais lento e mais
      # caro. Foi o que aconteceu no primeiro teste em produção: a leitura de
      # selo rodou em `gpt-5.5` porque `NEXODOC_LD_OPENAI_MODEL` não estava
      # posta, e é UMA CHAMADA POR PRANCHA.
      #
      # Regra: mexeu em modelo no `.env.local`, mexe aqui também.
      - key: OPENAI_API_KEY
        sync: false

      # O TETO MENSAL EM DÓLARES — a única coisa entre um erro de uso e a fatura.
      #
      # Sem esta variável NÃO HÁ TETO: `getMonthlyBudgetUsd()` devolve `null` e
      # `verificarTetoMensal` passa tudo. A rota de leitura de selo chama a
      # verificação justamente porque é UMA CHAMADA POR PRANCHA e um volume real
      # tem dezenas — no ar, hoje, essa guarda não faz nada.
      #
      # DECIDIDO EM 19/08/2026: US$ 20 por usuário, por mês.
      #
      # O número saiu de 3.320 chamadas medidas (`npm run mede:prefeitura` não,
      # `node scripts/estimativa-de-custo.ts`), e não de estimativa:
      #
      #   leitura de selo   US$ 0,0048 por prancha → volume de 44 folhas = US$ 0,21
      #   auditoria         US$ 0,43 mediana, US$ 1,90 a mais cara
      #   engenheiro pesado 20 volumes + 20 auditorias = US$ 16,63/mês
      #
      # Vinte dá folga sobre o pior uso legítimo e ainda bate a trave antes de um
      # erro virar fatura — alguém reprocessando o mesmo projeto vinte vezes.
      #
      # É POR USUÁRIO, não global: `verificarTetoMensal` soma o mês corrente com
      # `where: { userId }`. Cinco pessoas na Diretoria = teto teórico de US$ 100,
      # e o consumo real medido de um usuário comum foi US$ 0,91 no mês.
      #
      # O ADMIN É ISENTO do bloqueio (ver `isentoDoTeto`), porque é quem testa e
      # demonstra — mas o gasto dele continua contado, senão o número acima
      # deixaria de existir.
      - key: NEXODOC_MONTHLY_BUDGET_USD
        value: "20"

      # A LEITURA DE SELO. O gargalo de todo o fluxo: uma chamada com visão por
      # prancha, e um volume real tem dezenas — o custo daqui escala com o
      # tamanho do volume, não com o número de auditorias.
      #
      # Rodou em `gpt-5.4-mini` até 11/08/2026. Passou a `gpt-5.6-luna`, que
      # ganha nas DUAS pontas e por isso não há troca a ponderar aqui:
      #
      #   gpt-5.6-luna   $0,20 entrada / $1,20 saída por 1M
      #   gpt-5.4-mini   $0,75 entrada / $4,50 saída por 1M
      #
      # O Luna é 3,75x mais barato E é o tier que a própria OpenAI indica para
      # extração e classificação — que é exatamente o que se faz aqui: o modelo
      # só COPIA campo de carimbo, quem julga é regra determinística.
      #
      # CUIDADO ao "economizar" nesta chave: `mini` e `nano` PARECEM as opções
      # baratas pelo nome, e neste caso custam mais que o Luna. Confira a tabela
      # de preços antes de trocar, não o sufixo do nome.
      - key: NEXODOC_LD_OPENAI_MODEL
        value: gpt-5.6-luna

      # A conferência de identidade do selo: uma chamada só, sobre uma amostra.
      - key: NEXODOC_SELO_CHECK_MODEL
        value: gpt-5.6-luna

      # Organização de volumes: análise e sugestão no mesmo modelo.
      - key: NEXODOC_VOLUME_ANALYSIS_MODEL
        value: gpt-5.6-terra
      - key: NEXODOC_VOLUME_SUGGESTION_MODEL
        value: gpt-5.6-terra

      # CONVERSA — agente Nexo e chat pós-auditoria. Rápido e barato de
      # propósito: os dois respondem sobre material que JÁ foi julgado, então
      # pagam por latência baixa, não por deliberação.
      #
      # Chaves próprias porque `OPENAI_MODEL` é TAMBÉM o fallback da auditoria
      # profunda — baixar o modelo da conversa por ela levava a auditoria junto,
      # sem aviso.
      - key: NEXODOC_NEXO_MODEL
        value: gpt-5.6-terra
      - key: NEXODOC_AUDIT_CHAT_MODEL
        value: gpt-5.6-terra
      - key: NEXODOC_NEXO_REASONING_EFFORT
        value: low
      - key: NEXODOC_CHAT_REASONING_EFFORT
        value: low

      # Auditoria de memorial. Os três controles de vazão importam mais aqui do
      # que o modelo: são eles que decidem se uma auditoria profunda termina.
      #
      # `OPENAI_MODEL` sobrou para a auditoria genérica (não-memorial): é o
      # fallback de `OPENAI_DEEP_MODEL`. Desde que a conversa ganhou chave
      # própria, mexer aqui NÃO afeta mais o chat nem o agente.
      #
      # Saiu de `gpt-5.5` em 11/08/2026: o `terra` iguala o 5.5 nos benchmarks
      # da OpenAI por $2/$12 contra $5/$30. O 5.5 custava o mesmo que o `sol` —
      # preço de fronteira por geração anterior.
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: NEXODOC_AUDIT_MEMORIAL_STANDARD_MODEL
        value: gpt-5.6-terra
      - key: NEXODOC_AUDIT_MEMORIAL_DEEP_MODEL
        value: gpt-5.6-sol
      - key: NEXODOC_AUDIT_MEMORIAL_DEEP_GLOBAL_MODEL
        value: gpt-5.6-sol
      - key: NEXODOC_AUDIT_MEMORIAL_DEEP_VALIDATION_MODEL
        value: gpt-5.6-sol

      # O BLOCO tem modelo próprio, e a falta desta linha custava dinheiro todo
      # dia — descoberto em 19/08/2026, conferindo o Render contra o código.
      #
      # O papel `chunk` era o único do modo memorial sem override: caía no
      # `NEXODOC_AUDIT_MEMORIAL_DEEP_MODEL` e ia para o `sol`. Os dois fazem
      # trabalhos diferentes — a leitura GLOBAL enxerga o documento inteiro de
      # uma vez, o BLOCO examina ~10 páginas —, e cobrar preço de leitura global
      # por exame localizado multiplica por 2,5 o custo da passada MAIS NUMEROSA
      # da auditoria. Ver `lib/ai-providers.ts`, papel `chunk`.
      #
      # O `.env.local` já tinha isto desde 17/08. O Render não — e foi
      # exatamente a falha do `NEXODOC_ADMIN_TOKEN` repetida: quem configura no
      # `.env.local` e não repete aqui volta ao padrão do código sem aviso, e o
      # software continua funcionando, só que mais caro.
      - key: NEXODOC_AUDIT_MEMORIAL_DEEP_CHUNK_MODEL
        value: gpt-5.6-terra

      # A COBERTURA TOTAL — um nível só que lê o documento inteiro, sem teto de
      # blocos. Desligada: medido em 18x o custo cru contra 2,8x com blocos
      # agrupados. Explícita porque o padrão do código é o mesmo `false`, e uma
      # linha aqui é o que impede alguém ligar sem saber o que custa.
      - key: NEXODOC_AUDIT_COBERTURA_TOTAL
        value: "false"

      # A CAMADA DE REGRA determinística (`lib/audit-coherence.ts`) — o §12, a
      # cláusula geral de analogia, a conferência de marca.
      #
      # É a ÚNICA do grupo de flags da auditoria que é LIGADA por padrão, e a
      # única em que o padrão é o certo: as outras (`ENABLE_RULE_BASED_AUDIT`,
      # `ENABLE_AI_IDENTITY_PASS`, `ENABLE_AI_CROSS_DOCUMENT`,
      # `ENABLE_REFUTATION_PASS`) guardam motores legados ou caros e ficam fora
      # daqui de propósito.
      #
      # O teste é `!== "false"`, então basta alguém escrever `false` UMA vez
      # para derrubar a camada que pega três das quatro incongruências críticas
      # que a IA sozinha perde. Explícita para que desligá-la seja um gesto
      # deliberado, e não um efeito colateral.
      - key: NEXODOC_ENABLE_COHERENCE_PASS
        value: "true"
      - key: NEXODOC_MAX_CHUNKS_PER_FILE
        value: "24"
      - key: NEXODOC_CHUNK_CONCURRENCY
        value: "5"
      - key: NEXODOC_CHUNK_TIMEOUT_MS
        value: "120000"
      - key: NEXODOC_DEEP_CHUNK_MAX_OUTPUT_TOKENS
        value: "6000"

      # ---------------------------------------------------------------- flags
      # NEXT_PUBLIC_* é embutida na COMPILAÇÃO. Aqui ela vale para o runtime; o
      # que decide o pacote é o `ARG` do Dockerfile, que já vem `true`.
      - key: NEXT_PUBLIC_NEXO_ENABLED
        value: "true"
      # O atalho de login de desenvolvimento NUNCA em produção.
      - key: NEXODOC_DEV_AUTH
        value: "false"

      # ------------------------------------------------------------------ PDF
      # Vazia de propósito: o LibreOffice vive no próprio container
      # (`LIBREOFFICE_PATH` sai do Dockerfile). Preencher isto só faz sentido no
      # arranjo separado, com o serviço abaixo reativado.
      - key: DOCUMENT_CONVERTER_URL
        sync: false

  # O conversor separado, para quem preferir o arranjo antigo.
  # - type: web
  #   name: nexodoc-converter
  #   runtime: docker
  #   region: oregon
  #   plan: free
  #   branch: main
  #   rootDir: render-service
  #   dockerfilePath: ./Dockerfile
